<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator - School Management</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">SchoolHub</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="students.html">Students</a></li>
                <li><a href="teachers.html">Teachers</a></li>
                <li><a href="calculator.html" class="active">Calculator</a></li>
            </ul>
        </div>
    </nav>

    <section class="calc-section">
        <div class="container">
            <h1>Simple Calculator</h1>
            <div class="calculator">
                <div class="display">
                    <input type="text" id="result" readonly>
                </div>
                <div class="buttons">
                    <button class="btn clear" onclick="clearDisplay()">C</button>
                    <button class="btn operator" onclick="appendOperator('/')">/</button>
                    <button class="btn operator" onclick="appendOperator('*')">*</button>
                    <button class="btn operator" onclick="backspace()">←</button>

                    <button class="btn number" onclick="appendNumber('7')">7</button>
                    <button class="btn number" onclick="appendNumber('8')">8</button>
                    <button class="btn number" onclick="appendNumber('9')">9</button>
                    <button class="btn operator" onclick="appendOperator('-')">-</button>

                    <button class="btn number" onclick="appendNumber('4')">4</button>
                    <button class="btn number" onclick="appendNumber('5')">5</button>
                    <button class="btn number" onclick="appendNumber('6')">6</button>
                    <button class="btn operator" onclick="appendOperator('+')">+</button>

                    <button class="btn number" onclick="appendNumber('1')">1</button>
                    <button class="btn number" onclick="appendNumber('2')">2</button>
                    <button class="btn number" onclick="appendNumber('3')">3</button>
                    <button class="btn operator" onclick="appendOperator('.')" >.</button>

                    <button class="btn number zero" onclick="appendNumber('0')">0</button>
                    <button class="btn equals" onclick="calculate()">=</button>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2025 School Management System. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
