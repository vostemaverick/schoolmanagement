<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - School Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">SchoolHub</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="students.html" class="active">Students</a></li>
                <li><a href="teachers.html">Teachers</a></li>
                <li><a href="calculator.html">Calculator</a></li>
            </ul>
        </div>
    </nav>

    <section class="management-section">
        <div class="container">
            <h1>Student Management</h1>
            
            <div class="form-section">
                <h2>Add New Student</h2>
                <form id="studentForm">
                    <input type="text" id="studentName" placeholder="Student Name" required>
                    <input type="email" id="studentEmail" placeholder="Email" required>
                    <input type="text" id="studentRoll" placeholder="Roll Number" required>
                    <select id="studentGrade" required>
                        <option value="">Select Grade</option>
                        <option value="9">Grade 9</option>
                        <option value="10">Grade 10</option>
                        <option value="11">Grade 11</option>
                        <option value="12">Grade 12</option>
                    </select>
                    <button type="submit" class="btn-submit">Add Student</button>
                </form>
            </div>

            <div class="table-section">
                <h2>Students List</h2>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Roll Number</th>
                            <th>Grade</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                        <tr>
                            <td>John Doe</td>
                            <td>john@school.com</td>
                            <td>001</td>
                            <td>Grade 10</td>
                            <td><button class="btn-delete">Delete</button></td>
                        </tr>
                        <tr>
                            <td>Jane Smith</td>
                            <td>jane@school.com</td>
                            <td>002</td>
                            <td>Grade 11</td>
                            <td><button class="btn-delete">Delete</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2025 School Management System. All rights reserved.</p>
    </footer>

    <script src="management.js"></script>
</body>
</html>
